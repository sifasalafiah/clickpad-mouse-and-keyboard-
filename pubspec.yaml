name: clickpad
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  ffi: ^2.1.3
  google_mobile_ads: ^5.2.0
  wakelock_plus: ^1.2.8
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
